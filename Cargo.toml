[package]
name = "aiwars-mcp-downhill"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[lib]
name = "aiwars_mcp_downhill"
path = "src/lib.rs"

[[bin]]
name = "aiwars-mcp-downhill"
path = "src/main.rs"

[dependencies]
# The game-agnostic referee CORE (Game trait + Match lifecycle) and the shared wire
# types are reused from the PRIVATE AIWars monorepo as pinned GIT deps, so this repo
# builds standalone (no monorepo checkout / path deps). CI/Docker fetch them via the
# AIWARS_DEP_TOKEN secret (a `git insteadOf` rewrite in the Dockerfile). Pinned to the
# rev whose `game::{Game, Match}` + `protocol::MatchConfig` this crate is written against.
aiwars-mcp-warden = { git = "https://github.com/AsafFisher/AIWars", package = "aiwars-mcp-warden", rev = "656dd06f714edcb160910e5d928428fb7daf625b" }
protocol = { git = "https://github.com/AsafFisher/AIWars", package = "protocol", rev = "656dd06f714edcb160910e5d928428fb7daf625b" }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header", "timeout"] }
sha2 = "0.11.0"
hex = "0.4.3"
schemars = "1.2.1"
rmcp = { version = "1.7.0", features = ["server", "macros", "transport-streamable-http-server", "transport-streamable-http-server-session", "schemars", "tower"] }
# Pin the rmcp PROC-MACRO crate to the rmcp lib version (=1.7.0). With no committed
# Cargo.lock, cargo otherwise floats it to a newer minor whose generated code calls
# rmcp-1.7-absent APIs and fails the lib build (same fix as aiwars-interview).
rmcp-macros = "=1.7.0"
